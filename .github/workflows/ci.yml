name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Check bundle for leaked server config
        run: npm run check-bundle

      - name: Test
        run: npm test

  server:
    name: Server (test, health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Test
        working-directory: server
        run: npm test

      - name: Start server and check health
        working-directory: server
        env:
          CLIENT_ORIGIN: http://localhost:5173
          DATABASE_PATH: data/ci.db
          PORT: 4000
          # Not a real secret -- only encrypts throwaway data in this
          # ephemeral CI health check. Any valid 32-byte base64 value works.
          ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        run: |
          npm start &
          server_pid=$!
          for attempt in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/health; then
              kill "$server_pid"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not become healthy in time"
          kill "$server_pid" || true
          exit 1
